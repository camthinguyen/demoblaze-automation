name: Demoblaze Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npx playwright test --project=chromium
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload UI HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: ui-playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload UI test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx playwright test --project=api
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload API HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: api-playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload API test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: api-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run all k6 JavaScript scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance-results

          shopt -s nullglob
          files=(performance/*.js)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No k6 JavaScript files found in performance/"
            exit 1
          fi

          for file in "${files[@]}"; do
            name=$(basename "$file" .js)
            echo "Running $file"

            k6 run \
              --summary-export="performance-results/${name}-summary.json" \
              "$file"
          done

      - name: Upload performance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: performance-report
          path: performance-results/
          if-no-files-found: error
          retention-days: 14
