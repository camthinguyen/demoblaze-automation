
name: Demoblaze Automation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npx playwright test --project=chromium
        env:
          CI: true
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload UI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: ui-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx playwright test --project=api
        env:
          CI: true
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload API report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: api-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  performance-tests:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 performance test
        run: |
          mkdir -p performance-results
          k6 run \
            --summary-export=performance-results/k6-summary.json \
            performance/k6/entries.ts

      - name: Upload performance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: performance-k6-report
          path: performance-results/
          retention-days: 14
